PACKAGE_NAME="btrfs-rst"
PACKAGE_VERSION="1.0"
BUILT_MODULE_NAME[0]="btrfs"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
# The CONFIG_BTRFS_EXPERIMENTAL feature gate (which unlocks the
# raid-stripe-tree (RST) incompat feature needed for RAID on zoned devices)
# is enabled by the Makefile itself:
#
#     subdir-ccflags-y += -DCONFIG_BTRFS_EXPERIMENTAL
#
# Do NOT try to pass this through DKMS EXTRA_CFLAGS. EXTRA_CFLAGS does not
# reach the Kbuild compile stage for this out-of-tree build, so the module is
# built WITH the RST code but WITHOUT the feature registered in
# BTRFS_FEATURE_INCOMPAT_SUPP. The result loads fine but every RST filesystem
# mount fails with "cannot mount because of unknown incompat features (0x4000)".
MAKE[0]="make -C $kernel_source_dir M=$dkms_tree/$PACKAGE_NAME/$PACKAGE_VERSION/build modules"
